name: CI/CD

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  lfs: false
                  submodules: false

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build & Push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      hongzhengli/final_project:latest

    cd:
        if: needs.ci.result == 'success'
        needs: ci
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Deploy over SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  script_stop: true
                  script: |
                      set -euo pipefail
                      mkdir -p "${{ secrets.PROJECT_DIR }}"
                      cd "${{ secrets.PROJECT_DIR }}"
                      curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/HongzhengL/drone-simulation/main/docker-compose.yml
                      docker compose down || true
                      PORT="${{ secrets.PROJECT_PORT }}" docker compose up -d --pull always --build
